name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - run: zsh -n install.sh install-native.sh install-legacy.sh uninstall.sh scripts/*.sh
      - run: plutil -lint app/Info.plist launchd/*.plist
